    <div id="loading-screen" style="position: fixed; inset: 0; background: linear-gradient(135deg, #4C1D95, #2E1065); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease-out;">

          50% { transform: scale(1.05); opacity: 1; }
        }
        @keyframes shimmer {
          0% { background-position: -200% 0; }
          100% { background-position: 200% 0; }
        }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(6px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .splash-logo {
          width: 180px;
          height: auto;
          margin-bottom: 32px;
          animation: pulse-logo 2.5s infinite ease-in-out;

        }

        .loader-bar {
          width: 140px;
          height: 3px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 100px;
          overflow: hidden;
          position: relative;
        }
        .loader-progress {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
          background-size: 200% 100%;
          animation: shimmer 1.5s infinite linear;
        }

    <!-- React root -->
    <div id="root"></div>

    <script>
      // Hide loading screen when React app hydrates
      function hideLoader() {
        var loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            loader.style.display = 'none';
          }, 500);
        }
      }

      // Check periodically if React has rendered
      var checkInterval = setInterval(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          hideLoader();
          clearInterval(checkInterval);
        }
      }, 100);

      // Fallback: hide anyway after 10s
      setTimeout(hideLoader, 10000);
    </script>
