name: Deploy to Contabo

on:
  push:
    branches: [ main ] # Trigger on push or merge to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Backend to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Deployment..."
            cd ~/Kredibly
            
            # Force clean pull (prevents package-lock and other file conflicts)
            git fetch origin main
            git reset --hard origin/main
            
            # 1. Deploy Backend
            echo "📦 Deploying Backend..."
            cd ~/Kredibly/backend
            npm install
            pm2 restart 0 --update-env
            
            # 2. Deploy Frontend
            echo "📦 Deploying Frontend..."
            cd ~/Kredibly/frontend
            npm install
            VITE_API_BASE_URL=https://api.usekredibly.com/api npm run build
            
            # Copy built static files to Nginx folder
            mkdir -p /var/www/usekredibly.com/html
            rm -rf /var/www/usekredibly.com/html/*
            cp -r dist/* /var/www/usekredibly.com/html/
            
            echo "✅ Deployment Complete!"
